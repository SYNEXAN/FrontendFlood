name: Auto-Wake Kaggle GPU Backend

on:
  repository_dispatch:
    types: [wake-kaggle]
  workflow_dispatch:
    inputs:
      force:
        description: 'Bắt buộc push kernel mới (ghi đè phiên cũ)'
        required: false
        default: false
        type: boolean

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Kaggle CLI
        run: |
          pip install --upgrade kaggle

      - name: Smart Low-Quota Rotation & Wake GPU
        env:
          KAGGLE_ACCOUNTS_JSON: ${{ secrets.KAGGLE_ACCOUNTS_JSON }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MIN_GPU_HOURS_THRESHOLD: '1.0'
          FORCE_PUSH: ${{ inputs.force || github.event.client_payload.force || 'false' }}
        run: |
          python scripts/rotate_kaggle.py
