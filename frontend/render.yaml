services:
  # Option 1: Web Service (Node.js) with Auto-Wake API proxy
  - type: web
    name: flood-traffic-monitor
    env: node
    plan: free
    buildCommand: "cd frontend && npm install"
    startCommand: "cd frontend && node server.js"
    envVars:
      - key: PORT
        value: 10000
      - key: DEFAULT_BACKEND_URL
        value: https://hush-harmless-erased.ngrok-free.dev
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false

